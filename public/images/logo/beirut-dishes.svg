<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beirut Dishes">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.35" stop-color="#faeaae"/>
      <stop offset="0.7" stop-color="#c8a13d"/>
      <stop offset="1" stop-color="#8a6a1f"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#15151d"/>
      <stop offset="1" stop-color="#010103"/>
    </radialGradient>
  </defs>

  <!-- outer disc -->
  <circle cx="120" cy="120" r="116" fill="url(#core)" stroke="url(#gold)" stroke-width="2"/>

  <!-- 8-point Moroccan star ring -->
  <g stroke="url(#gold)" stroke-width="2" fill="none" opacity="0.9">
    <rect x="52" y="52" width="136" height="136" rx="14" transform="rotate(45 120 120)"/>
    <rect x="52" y="52" width="136" height="136" rx="14"/>
  </g>
  <circle cx="120" cy="120" r="86" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>

  <!-- Arabic monogram: ( -->
  <text x="120" y="150" text-anchor="middle" font-family="'Amiri','Times New Roman',serif" font-size="120" fill="url(#gold)">(</text>

  <!-- dot flourishes -->
  <circle cx="120" cy="44" r="3" fill="url(#gold)"/>
  <circle cx="120" cy="196" r="3" fill="url(#gold)"/>
  <circle cx="44" cy="120" r="3" fill="url(#gold)"/>
  <circle cx="196" cy="120" r="3" fill="url(#gold)"/>
</svg>
